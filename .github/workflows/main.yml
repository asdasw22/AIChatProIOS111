name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Choose unsigned for unsigned IPA, or use Apple signing export method"
        required: true
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - development
          - ad-hoc
          - app-store-connect
          - enterprise
  push:
    branches:
      - main
      - master
    paths:
      - "ios/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build TelegramPhotoDrive IPA
    runs-on: macos-15
    timeout-minutes: 60

    env:
      PROJECT_PATH: ios/TelegramPhotoDrive.xcodeproj
      SCHEME: TelegramPhotoDrive
      CONFIGURATION: Release
      DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
      UNSIGNED_BUILD_PATH: ${{ runner.temp }}/UnsignedBuild
      ARCHIVE_PATH: ${{ runner.temp }}/TelegramPhotoDrive.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/export
      KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Prepare build variables
        run: |
          if [ -z "$BUNDLE_IDENTIFIER" ]; then
            echo "BUNDLE_IDENTIFIER=com.youssef.telegramphotodrive" >> "$GITHUB_ENV"
          fi
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID=YOUSSEFTEAM" >> "$GITHUB_ENV"
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID=8708103807" >> "$GITHUB_ENV"
          fi

      - name: Show build settings
        run: |
          echo "Export method: ${{ github.event.inputs.export_method || 'unsigned' }}"
          echo "Bundle identifier: $BUNDLE_IDENTIFIER"
          echo "Telegram chat id: $TELEGRAM_CHAT_ID"
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build unsigned app
        if: ${{ (github.event.inputs.export_method || 'unsigned') == 'unsigned' }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee "${RUNNER_TEMP}/xcodebuild-unsigned.log"

      - name: Package unsigned IPA
        if: ${{ (github.event.inputs.export_method || 'unsigned') == 'unsigned' }}
        run: |
          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi
          rm -rf "$UNSIGNED_BUILD_PATH"
          mkdir -p "$UNSIGNED_BUILD_PATH/Payload" "$EXPORT_PATH"
          cp -R "$APP_PATH" "$UNSIGNED_BUILD_PATH/Payload/"
          cd "$UNSIGNED_BUILD_PATH"
          /usr/bin/zip -qry "$EXPORT_PATH/TelegramPhotoDrive-unsigned.ipa" Payload
          ls -la "$EXPORT_PATH"

      - name: Validate required signing secrets
        if: ${{ (github.event.inputs.export_method || 'unsigned') != 'unsigned' }}
        run: |
          missing=0
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            BUILD_PROVISION_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Import Apple signing certificate
        if: ${{ (github.event.inputs.export_method || 'unsigned') != 'unsigned' }}
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/build_certificate.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

      - name: Install provisioning profile
        if: ${{ (github.event.inputs.export_method || 'unsigned') != 'unsigned' }}
        id: profile
        run: |
          PROFILE_PATH="${RUNNER_TEMP}/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

      - name: Archive signed app
        if: ${{ (github.event.inputs.export_method || 'unsigned') != 'unsigned' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.name }}" \
            clean archive | tee "${RUNNER_TEMP}/xcodebuild-archive.log"

      - name: Create ExportOptions.plist
        if: ${{ (github.event.inputs.export_method || 'unsigned') != 'unsigned' }}
        run: |
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ github.event.inputs.export_method }}</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_IDENTIFIER</key>
              <string>${{ steps.profile.outputs.name }}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint "${RUNNER_TEMP}/ExportOptions.plist"

      - name: Export signed IPA
        if: ${{ (github.event.inputs.export_method || 'unsigned') != 'unsigned' }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" | tee "${RUNNER_TEMP}/xcodebuild-export.log"
          ls -la "$EXPORT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPhotoDrive-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/xcodebuild-unsigned.log
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup signing assets
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.profile.outputs.uuid }}.mobileprovision" || true
